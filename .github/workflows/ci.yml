name: Commerce checks
on:
  pull_request:
  push:
    branches: [main, implementation/commerce-foundation]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
      - run: node tools/check_interactions.mjs
      - run: node tools/check_commerce_foundation.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start built local preview
        run: pnpm --filter @tiraze/web preview --host 127.0.0.1 --port 4330 > "$RUNNER_TEMP/tiraze-preview.log" 2>&1 &
      - run: pnpm test:e2e
